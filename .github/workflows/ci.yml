name: CI

# Continuous Integration: lint + tests on every push/PR, then build the Docker
# image and run a smoke pipeline inside it. Runs entirely on the committed
# sample dataset, so no secrets or network dataset download are required.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu || pip install torch
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests (pytest)
        run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kt-pipeline:ci .

      - name: Smoke-run pipeline in container (sample, quick budgets)
        run: docker run --rm kt-pipeline:ci --data-source sample --quick
